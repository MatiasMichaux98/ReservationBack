services:
  app.api:
    image: ${DOCKER_REGISTRY-}appapi
    build:
      context: .
      dockerfile: App.Api/Dockerfile
    ports:
     - "${API_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__GetConnection=Server=product-db,1433;Database=MoviePruebas;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
  product-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    #container_name: Products_Db
    volumes:
        - ./.containers/database:/var/opt/mssql/data
    ports:
    - "1434:1433"
    environment:
       ACCEPT_EULA: "Y"
       MSSQL_SA_PASSWORD: "${DB_PASSWORD}"